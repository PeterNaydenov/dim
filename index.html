<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dim demo</title>
    <style>
      body { font-family: system-ui, sans-serif; padding: 2rem; max-width: 40rem; margin: 0 auto; color: #1f2937; }
      h1 { margin-top: 0; }
      .counter { display: flex; gap: 1rem; align-items: baseline; padding: 1rem; border: 1px solid #e5e7eb; border-radius: 6px; background: #fafafa; }
      button { padding: 0.4rem 0.9rem; cursor: pointer; }
      .hint { color: #6b7280; font-size: 0.9em; }
      kbd { padding: 1px 5px; border: 1px solid #d1d5db; border-radius: 3px; font-family: inherit; font-size: 0.85em; background: #fff; }
    </style>
  </head>
  <body>
    <h1>dim demo</h1>
    <p>
      Click <strong>+1</strong> to bump the counter. Each update is cached, so
      <kbd>u</kbd> undoes the last one. <kbd>U</kbd> (shift) calls <code>back()</code> repeatedly.
    </p>
    <div class="counter">
      <button id="btn">+1</button>
      <span id="count">0</span>
    </div>
    <p class="hint">Source lives in <code>src/main.js</code>.</p>

    <script type="module">
      import dim from '/src/main.js'

      const d = dim()

      const countEl = document.querySelector('#count')
      d.set(({ start, end }) => {
        countEl.before(start)
        countEl.after(end)
        return 'counter'
      })

      const range = d.get('counter')
      const btn   = document.querySelector('#btn')

      let n = 0
      btn.addEventListener('click', () => {
        n += 1
        range.update(String(n), 'cache')
      })

      document.addEventListener('keydown', (e) => {
        if ( e.key.toLowerCase() !== 'u' )   return
        if ( e.shiftKey ) {
          while ( n > 0 ) {
            range.back()
            n -= 1
          }
        } else if ( n > 0 ) {
          range.back()
          n -= 1
        }
      })

      window.d = d
      window.range = range
    </script>
  </body>
</html>
